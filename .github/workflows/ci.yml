name: ci

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: SKILL.md follows the open Agent Skills format
        run: |
          # pinned to a commit from August 2026; the validator needs Python 3.11 or later
          pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate skills/tieout
      - name: Manifests are valid JSON
        run: |
          python -c "import json; [json.load(open(f)) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
      - name: Hypothesis catalog tests
        run: python tests/test_hypotheses.py
      - name: Script tests
        run: python tests/test_scripts.py
      - name: Synthetic reconcile example
        run: python examples/reconcile-synthetic/run_example.py
      - name: Synthetic BI fixture is reproducible
        if: runner.os == 'Linux'
        run: |
          python examples/clone-bi-synthetic/make_fixture.py
          git diff --exit-code -- examples/clone-bi-synthetic
      - name: Compact AGENTS.md is in sync with SKILL.md
        if: runner.os == 'Linux'
        run: python dev/build_agents_md.py --check
